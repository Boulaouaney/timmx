name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv python install
      - run: uvx ruff format --check .
      - run: uvx ruff check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Neither coremltools nor coreai-core has Python 3.14 or Windows wheels. coreai-core builds
      # for manylinux x86_64 and macOS 26+ arm64, which macos-latest now is, so the macOS job also
      # covers the Core AI runtime tests (they skip off-Darwin).
      - run: uv sync --group dev --extra onnx --extra openvino --extra ncnn ${{ (matrix.python-version != '3.14' && matrix.os != 'windows-latest') && '--extra coreml --extra coreai' || '' }}
      - run: uv run pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv python install
      - run: uv build
