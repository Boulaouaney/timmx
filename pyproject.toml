[project]
name = "timmx"
version = "0.10.1"
description = "Extensible CLI and Python package for exporting timm models."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Youssef Boulaouane", email = "y.boulaouane11@gmail.com" }]
keywords = ["coreml", "deep-learning", "executorch", "inference", "litert", "model-export", "onnx", "openvino", "pytorch", "tensorrt", "timm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "numpy",
  "rich",
  "timm",
  "torch>=2.13",
  "typer",
]

[project.urls]
Homepage = "https://github.com/Boulaouaney/timmx"
Issues = "https://github.com/Boulaouaney/timmx/issues"
Repository = "https://github.com/Boulaouaney/timmx"

[project.scripts]
timmx = "timmx.cli:main"

[project.optional-dependencies]
coreai = ["coreai-torch>=0.4.3"]
coreml = ["coremltools>=9.0", "scikit-learn"]
executorch = ["executorch>=1.5"]
litert = ["litert-torch>=0.9.4"]
ncnn = ["ncnn", "pnnx"]
onnx = ["onnx>=1.21", "onnxruntime>=1.29", "onnxscript>=0.7", "onnxslim"]
openvino = ["openvino>=2026.3"]

[dependency-groups]
dev = [
  "pytest>=8.3.4",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-q"
# Third-party deprecation chatter (hundreds of lines per run) that hides real failures.
filterwarnings = [
  "ignore:Function _TORCH_OPS_REGISTRY.__contains__ is deprecated:DeprecationWarning",
  "ignore:.*torch.jit.(script|trace).*is deprecated:FutureWarning",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# pinned so newer ruff defaults do not change CI
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
# Dev/CI resolve every extra at once, and litert-torch's conservative pins (torch<2.14, and
# typing-extensions<4.13 via xdsl, which blocks onnx>=1.22) would hold the whole project one
# release back. Both are lifted here so CI tests the latest of everything; the suite passes with
# litert-torch on the overridden versions. Published metadata is untouched, so pip users still get
# whatever litert-torch allows.
override-dependencies = ["torch", "typing-extensions"]

[tool.uv.build-backend]
module-name = "timmx"
module-root = "src"
