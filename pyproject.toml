[project]
name = "timmx"
version = "0.8.0"
description = "Extensible CLI and Python package for exporting timm models."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Youssef Boulaouane", email = "y.boulaouane11@gmail.com" }]
keywords = [
  "coreml",
  "deep-learning",
  "executorch",
  "inference",
  "litert",
  "model-export",
  "onnx",
  "openvino",
  "pytorch",
  "tensorrt",
  "timm"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "numpy",
  "rich",
  "timm",
  "torch>=2.13",
  "typer",
]

[project.optional-dependencies]
coreai = ["coreai-torch>=0.4.2"]
coreml = ["coremltools>=9.0", "scikit-learn"]
executorch = ["executorch>=1.4"]
litert = ["litert-torch>=0.9.4"]
ncnn = ["ncnn", "pnnx"]
onnx = ["onnx>=1.21", "onnxruntime>=1.29", "onnxscript>=0.7", "onnxslim"]
openvino = ["openvino>=2026.3"]

[project.scripts]
timmx = "timmx.cli:main"

[project.urls]
Homepage = "https://github.com/Boulaouaney/timmx"
Issues = "https://github.com/Boulaouaney/timmx/issues"
Repository = "https://github.com/Boulaouaney/timmx"

[dependency-groups]
dev = [
  "pytest>=8.3.4",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "timmx"
module-root = "src"

[tool.uv]
# Dev/CI resolve every extra at once, and litert-torch's conservative pins (torch<2.14, and
# typing-extensions<4.13 via xdsl, which blocks onnx>=1.22) would hold the whole project one
# release back. Both are lifted here so CI tests the latest of everything; the suite passes with
# litert-torch on the overridden versions. Published metadata is untouched, so pip users still get
# whatever litert-torch allows.
override-dependencies = ["torch", "typing-extensions"]


[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# pinned so newer ruff defaults do not change CI
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
